name: daily-update
on:
  schedule:
    - cron: "45 22 * * *" # 07:45 JST (UTC+9)
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
        env:
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          ETF_FLOW_CSV_URL: ${{ secrets.ETF_FLOW_CSV_URL }}
      - name: Commit persisted report when changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f reports/latest.md reports/archive data/btc_cycle.db
          git diff --cached --quiet || git commit -m "chore: daily BTC cycle update"
          git push
